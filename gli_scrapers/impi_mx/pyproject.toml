[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impi_scraper_mx"
version = "0.1.0"
description = "Middleware local para el portal IMPI México (marcia.impi.gob.mx)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Genomma Lab"},
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "respx>=0.21.0",
]

[project.scripts]
impi-scraper-mx = "impi_scraper_mx.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["impi_scraper_mx*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Prepend el package dir al sys.path para que `from impi_scraper_mx import X`
# resuelva al package real (no a la namespace-package que Python ve si
# pytest corre desde /workspace/ y cwd queda en sys.path).
pythonpath = ["."]
