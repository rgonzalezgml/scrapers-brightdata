name: Olive Young Ranking
description: >
  Modelo semantico del historico de ranking best-seller de Olive Young Global
  (plataforma coreana de belleza y cuidado personal). Permite analizar posiciones
  de ranking, precios, ratings y tendencias de productos de skincare y K-beauty.
  IMPORTANTE: Siempre filtrar por la fecha maxima de FECHA_CONSULTA para obtener
  el ranking mas reciente, a menos que el usuario solicite explicitamente un
  historico o comparacion entre fechas.

tables:
  - name: VW_OLIVEYOUNG_RANK_HIST
    description: >
      Vista con el historico de ranking best-seller de Olive Young Global.
      Granularidad: producto x fecha de consulta. Rankings del 1 al 100.
      Incluye precio original y de oferta, rating y disponibilidad de stock.
      Datos desde abril 2026.
    base_table:
      database: PRD_CNS_SHD
      schema: DATA_GNM
      table: VW_OLIVEYOUNG_RANK_HIST

    filters:
      - name: ULTIMO_RANKING
        synonyms:
          - ranking actual
          - ultimo
          - mas reciente
          - current ranking
        description: >
          Filtro por defecto que selecciona unicamente los registros de la fecha
          de consulta mas reciente. Debe aplicarse SIEMPRE a menos que el usuario
          pida explicitamente un historico o comparacion entre periodos.
        expr: FECHA_CONSULTA = (SELECT MAX(FECHA_CONSULTA) FROM PRD_CNS_SHD.DATA_GNM.VW_OLIVEYOUNG_RANK_HIST)

    dimensions:
      - name: ID_PRODUCTO
        synonyms:
          - codigo producto
          - SKU
          - producto ID
          - prdtNo
        description: SKU del producto en Olive Young
        expr: ID_PRODUCTO
        data_type: VARCHAR

      - name: MARCA
        synonyms:
          - brand
          - nombre marca
          - marca coreana
        description: Nombre de la marca del producto
        expr: MARCA
        data_type: VARCHAR

      - name: NOMBRE_PRODUCTO
        synonyms:
          - producto
          - nombre
          - product name
          - nombre ingles
        description: Nombre del producto en ingles
        expr: NOMBRE_PRODUCTO
        data_type: VARCHAR

      - name: NOMBRE_PRODUCTO_KR
        synonyms:
          - nombre coreano
          - korean name
          - nombre korea
        description: Nombre del producto en coreano
        expr: NOMBRE_PRODUCTO_KR
        data_type: VARCHAR

      - name: PRECIO_ORIGINAL
        synonyms:
          - precio lista
          - precio sin descuento
          - original price
          - precio regular
        description: Precio original del producto con simbolo de moneda, sin descuento
        expr: PRECIO_ORIGINAL
        data_type: VARCHAR

      - name: PRECIO_OFERTA
        synonyms:
          - precio descuento
          - precio promocion
          - sale price
          - precio con descuento
        description: Precio de oferta o con descuento del producto con simbolo de moneda
        expr: PRECIO_OFERTA
        data_type: VARCHAR

      - name: FLAG_SIN_STOCK
        synonyms:
          - sin stock
          - agotado
          - out of stock
          - sold out
        description: Indica si el producto esta agotado
        expr: FLAG_SIN_STOCK
        data_type: BOOLEAN

      - name: URL_IMAGEN
        synonyms:
          - imagen
          - foto
          - image url
        description: URL de la imagen principal del producto
        expr: URL_IMAGEN
        data_type: VARCHAR

      - name: FUENTE
        synonyms:
          - fuente datos
          - origen
          - source
        description: Identificador del scraper que origino la fila
        expr: FUENTE
        data_type: VARCHAR

    time_dimensions:
      - name: FECHA_CONSULTA
        synonyms:
          - fecha
          - fecha extraccion
          - fecha scraping
          - dia consulta
          - date
        description: Fecha en que se realizo la extraccion del dato
        expr: FECHA_CONSULTA
        data_type: DATE

    measures:
      - name: RANKING
        synonyms:
          - posicion
          - rank
          - lugar
          - puesto
          - position
        description: Posicion del producto en el ranking best-seller de Olive Young (1-100)
        expr: RANKING
        data_type: NUMBER
        default_aggregation: avg

      - name: RATING
        synonyms:
          - calificacion
          - score
          - estrellas
          - valoracion
          - puntuacion
        description: Calificacion promedio del producto en la plataforma
        expr: RATING
        data_type: FLOAT
        default_aggregation: avg

      - name: TOTAL_PRODUCTOS
        synonyms:
          - cantidad productos
          - conteo productos
          - count products
          - num productos
        description: Cantidad total de productos distintos en el ranking
        expr: ID_PRODUCTO
        data_type: VARCHAR
        default_aggregation: count_distinct

      - name: TOTAL_MARCAS
        synonyms:
          - cantidad marcas
          - conteo marcas
          - count brands
          - num marcas
        description: Cantidad total de marcas distintas en el ranking
        expr: MARCA
        data_type: VARCHAR
        default_aggregation: count_distinct

      - name: PRODUCTOS_SIN_STOCK
        synonyms:
          - agotados
          - sin stock
          - out of stock count
          - sold out count
          - cuantos agotados
        description: Cantidad de productos agotados en el ranking
        expr: CASE WHEN FLAG_SIN_STOCK = TRUE THEN 1 ELSE 0 END
        data_type: NUMBER
        default_aggregation: sum

      - name: MEJOR_POSICION
        synonyms:
          - mejor ranking
          - posicion mas alta
          - top rank
          - mejor puesto
          - best position
        description: Mejor posicion alcanzada en el ranking (valor mas bajo = mejor)
        expr: RANKING
        data_type: NUMBER
        default_aggregation: min

    verified_queries:
      - name: top10_actual
        question: "¿Cuáles son los 10 productos más vendidos en Olive Young hoy?"
        verified_at: "2026-05-05"
        sql: |
          SELECT NOMBRE_PRODUCTO, MARCA, RANKING, RATING, PRECIO_OFERTA
          FROM PRD_CNS_SHD.DATA_GNM.VW_OLIVEYOUNG_RANK_HIST
          WHERE FECHA_CONSULTA = (SELECT MAX(FECHA_CONSULTA) FROM PRD_CNS_SHD.DATA_GNM.VW_OLIVEYOUNG_RANK_HIST)
          ORDER BY RANKING ASC
          LIMIT 10

      - name: productos_agotados
        question: "¿Cuáles son los productos agotados en el ranking actual de Olive Young?"
        verified_at: "2026-05-05"
        sql: |
          SELECT NOMBRE_PRODUCTO, MARCA, RANKING, PRECIO_ORIGINAL
          FROM PRD_CNS_SHD.DATA_GNM.VW_OLIVEYOUNG_RANK_HIST
          WHERE FECHA_CONSULTA = (SELECT MAX(FECHA_CONSULTA) FROM PRD_CNS_SHD.DATA_GNM.VW_OLIVEYOUNG_RANK_HIST)
            AND FLAG_SIN_STOCK = TRUE
          ORDER BY RANKING ASC

      - name: marcas_dominantes_top20
        question: "¿Qué marcas tienen más productos en el top 20 de Olive Young?"
        verified_at: "2026-05-05"
        sql: |
          SELECT MARCA, COUNT(*) AS TOTAL_PRODUCTOS, MIN(RANKING) AS MEJOR_POSICION, AVG(RATING) AS RATING_PROMEDIO
          FROM PRD_CNS_SHD.DATA_GNM.VW_OLIVEYOUNG_RANK_HIST
          WHERE FECHA_CONSULTA = (SELECT MAX(FECHA_CONSULTA) FROM PRD_CNS_SHD.DATA_GNM.VW_OLIVEYOUNG_RANK_HIST)
            AND RANKING <= 20
          GROUP BY MARCA
          ORDER BY TOTAL_PRODUCTOS DESC, MEJOR_POSICION ASC
