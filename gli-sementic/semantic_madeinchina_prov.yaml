name: Made-in-China Proveedores
description: >
  Modelo semantico del historico de proveedores y precios de quimicos industriales
  scrapeados de made-in-china.com (B2B chino). Permite analizar precios, especificaciones
  quimicas (CAS, formula, EINECS, grado), MOQ y proveedores de insumos de interes para Genomma Lab.
  IMPORTANTE: Siempre filtrar por la fecha maxima de FECHA_CONSULTA para obtener los precios
  mas recientes, a menos que el usuario solicite explicitamente un historico o comparacion entre fechas.

tables:
  - name: VW_MADEINCHINA_PROV_HIST
    description: >
      Vista con el historico de proveedores y precios de quimicos industriales en Made-in-China.
      Granularidad: producto x fecha de consulta. Incluye precio y conversion USD, MOQ,
      especificaciones quimicas (CAS, formula, EINECS, grado, apariencia) y datos del proveedor.
    base_table:
      database: PRD_CNS_SHD
      schema: DATA_GNM
      table: VW_MADEINCHINA_PROV_HIST

    filters:
      - name: ULTIMO_PRECIO
        synonyms:
          - precio actual
          - ultimo
          - mas reciente
          - current price
        description: >
          Filtro por defecto que selecciona unicamente los registros de la fecha de consulta
          mas reciente. Debe aplicarse SIEMPRE a menos que el usuario pida explicitamente
          un historico o comparacion entre periodos.
        expr: FECHA_CONSULTA = (SELECT MAX(FECHA_CONSULTA) FROM PRD_CNS_SHD.DATA_GNM.VW_MADEINCHINA_PROV_HIST)

      - name: SOLO_QUIMICOS
        synonyms:
          - quimicos
          - chemicals
          - compuestos quimicos
        description: Filtra solo productos de tipo quimico
        expr: TIPO = 'CHEMICAL'

      - name: SOLO_EMPAQUE
        synonyms:
          - empaque
          - packaging
          - envases
        description: Filtra solo productos de tipo empaque
        expr: TIPO = 'PACKAGING'

    dimensions:
      - name: ID_PRODUCTO
        synonyms:
          - codigo producto
          - product id
          - SKU
        description: Identificador unico del producto en made-in-china.com
        expr: ID_PRODUCTO
        data_type: VARCHAR

      - name: SKU
        synonyms:
          - sku producto
          - referencia
          - model number
        description: SKU del producto
        expr: SKU
        data_type: VARCHAR

      - name: URL_PRODUCTO
        synonyms:
          - url
          - link
          - enlace producto
          - product url
        description: URL del producto en made-in-china.com
        expr: URL_PRODUCTO
        data_type: VARCHAR

      - name: NOMBRE_PRODUCTO
        synonyms:
          - producto
          - nombre
          - product name
        description: Nombre del producto normalizado por el scraper
        expr: NOMBRE_PRODUCTO
        data_type: VARCHAR

      - name: NOMBRE_PRODUCTO_RAW
        synonyms:
          - nombre original
          - nombre fuente
          - raw name
        description: Nombre del producto tal como aparece en la fuente, sin normalizar
        expr: NOMBRE_PRODUCTO_RAW
        data_type: VARCHAR

      - name: TIPO
        synonyms:
          - tipo producto
          - product type
          - clasificacion
        description: Tipo de producto (CHEMICAL o PACKAGING)
        expr: TIPO
        data_type: VARCHAR

      - name: CATEGORIA
        synonyms:
          - category
          - rubro
          - segmento
        description: Categoria del producto segun catalogo interno
        expr: CATEGORIA
        data_type: VARCHAR

      - name: PRECIO_RAW
        synonyms:
          - precio texto
          - precio original
          - precio fuente
          - raw price
        description: Precio tal como aparece en la pagina, sin procesar
        expr: PRECIO_RAW
        data_type: VARCHAR

      - name: PRECIO_MIN_USD
        synonyms:
          - precio minimo
          - min price
          - precio desde
          - precio base usd
        description: Objeto JSON con precio minimo en USD (value, currency, symbol)
        expr: PRECIO_MIN_USD
        data_type: VARCHAR

      - name: PRECIO_MAX_USD
        synonyms:
          - precio maximo
          - max price
          - precio hasta
          - precio techo usd
        description: Objeto JSON con precio maximo en USD (value, currency, symbol)
        expr: PRECIO_MAX_USD
        data_type: VARCHAR

      - name: MONEDA
        synonyms:
          - currency
          - divisa
          - tipo moneda
        description: Codigo de moneda del precio
        expr: MONEDA
        data_type: VARCHAR

      - name: MOQ_UNIDAD
        synonyms:
          - unidad moq
          - unit moq
          - unidad orden minima
        description: Unidad de medida de la cantidad minima de pedido
        expr: MOQ_UNIDAD
        data_type: VARCHAR

      - name: CAS
        synonyms:
          - numero cas
          - cas number
          - registro cas
          - identificador quimico
        description: Numero CAS del compuesto quimico
        expr: CAS
        data_type: VARCHAR

      - name: FORMULA
        synonyms:
          - formula quimica
          - chemical formula
          - estructura quimica
        description: Formula quimica del compuesto
        expr: FORMULA
        data_type: VARCHAR

      - name: EINECS
        synonyms:
          - numero einecs
          - einecs number
          - registro europeo
        description: Numero EINECS del compuesto
        expr: EINECS
        data_type: VARCHAR

      - name: GRADO
        synonyms:
          - grado calidad
          - quality grade
          - especificacion grado
        description: Grado de calidad del compuesto (ej. Superior Grade)
        expr: GRADO
        data_type: VARCHAR

      - name: APARIENCIA
        synonyms:
          - apariencia fisica
          - appearance
          - estado fisico
        description: Apariencia fisica del compuesto (ej. Solid)
        expr: APARIENCIA
        data_type: VARCHAR

      - name: ID_PROVEEDOR
        synonyms:
          - codigo proveedor
          - supplier id
          - vendor id
        description: Identificador unico del proveedor en made-in-china.com
        expr: ID_PROVEEDOR
        data_type: VARCHAR

      - name: PROVEEDOR
        synonyms:
          - supplier
          - fabricante
          - vendedor
          - empresa
        description: Nombre del proveedor tal como aparece en la fuente
        expr: PROVEEDOR
        data_type: VARCHAR

      - name: URL_IMAGEN
        synonyms:
          - imagen
          - foto
          - image
        description: URL de la imagen principal del producto
        expr: URL_IMAGEN
        data_type: VARCHAR

      - name: FUENTE
        synonyms:
          - fuente datos
          - origen
          - source
        description: Identificador del scraper que origino la fila (made_in_china)
        expr: FUENTE
        data_type: VARCHAR

    time_dimensions:
      - name: FECHA_CONSULTA
        synonyms:
          - fecha
          - fecha extraccion
          - fecha scraping
          - dia
          - date
        description: Fecha en que se realizo la extraccion del dato
        expr: FECHA_CONSULTA
        data_type: DATE

      - name: FECHA_SCRAPING
        synonyms:
          - fecha scraping producto
          - fecha dato
          - scraped date
        description: Fecha en que se realizo el scraping del producto
        expr: FECHA_SCRAPING
        data_type: DATE

    measures:
      - name: MOQ_CANTIDAD
        synonyms:
          - moq
          - cantidad minima
          - minimum order quantity
          - orden minima
        description: Cantidad minima de pedido en valor numerico
        expr: MOQ_CANTIDAD
        data_type: NUMBER
        default_aggregation: avg

      - name: TOTAL_PRODUCTOS
        synonyms:
          - cantidad productos
          - conteo
          - count products
        description: Cantidad total de productos distintos en el historico
        expr: ID_PRODUCTO
        data_type: VARCHAR
        default_aggregation: count_distinct

      - name: TOTAL_PROVEEDORES
        synonyms:
          - cantidad proveedores
          - conteo proveedores
          - count suppliers
        description: Cantidad total de proveedores distintos
        expr: ID_PROVEEDOR
        data_type: VARCHAR
        default_aggregation: count_distinct

    verified_queries:
      - name: proveedores_por_cas
        question: "¿Qué proveedores en Made-in-China ofrecen un compuesto por número CAS?"
        verified_at: "2026-05-05"
        sql: |
          SELECT CAS, NOMBRE_PRODUCTO, FORMULA, GRADO, APARIENCIA,
                 PROVEEDOR, PRECIO_RAW, MOQ_CANTIDAD, MOQ_UNIDAD
          FROM PRD_CNS_SHD.DATA_GNM.VW_MADEINCHINA_PROV_HIST
          WHERE FECHA_CONSULTA = (SELECT MAX(FECHA_CONSULTA) FROM PRD_CNS_SHD.DATA_GNM.VW_MADEINCHINA_PROV_HIST)
            AND CAS IS NOT NULL
          ORDER BY CAS, MOQ_CANTIDAD ASC NULLS LAST

      - name: moq_minimo_por_producto
        question: "¿Cuál es el MOQ mínimo disponible por producto en Made-in-China?"
        verified_at: "2026-05-05"
        sql: |
          SELECT NOMBRE_PRODUCTO, CAS,
                 MIN(MOQ_CANTIDAD) AS MOQ_MINIMO,
                 MAX(MOQ_CANTIDAD) AS MOQ_MAXIMO,
                 COUNT(DISTINCT PROVEEDOR) AS TOTAL_PROVEEDORES
          FROM PRD_CNS_SHD.DATA_GNM.VW_MADEINCHINA_PROV_HIST
          WHERE FECHA_CONSULTA = (SELECT MAX(FECHA_CONSULTA) FROM PRD_CNS_SHD.DATA_GNM.VW_MADEINCHINA_PROV_HIST)
            AND MOQ_CANTIDAD IS NOT NULL
          GROUP BY NOMBRE_PRODUCTO, CAS
          ORDER BY TOTAL_PROVEEDORES DESC

      - name: quimicos_con_especificaciones_completas
        question: "¿Qué químicos tienen fórmula, grado y apariencia registrados en Made-in-China?"
        verified_at: "2026-05-05"
        sql: |
          SELECT NOMBRE_PRODUCTO, CAS, FORMULA, GRADO, APARIENCIA,
                 COUNT(DISTINCT PROVEEDOR) AS PROVEEDORES
          FROM PRD_CNS_SHD.DATA_GNM.VW_MADEINCHINA_PROV_HIST
          WHERE FECHA_CONSULTA = (SELECT MAX(FECHA_CONSULTA) FROM PRD_CNS_SHD.DATA_GNM.VW_MADEINCHINA_PROV_HIST)
            AND FORMULA IS NOT NULL AND GRADO IS NOT NULL
          GROUP BY NOMBRE_PRODUCTO, CAS, FORMULA, GRADO, APARIENCIA
          ORDER BY PROVEEDORES DESC
